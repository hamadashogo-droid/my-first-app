<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eee1c5" />
    <title>桃花の旅路</title>
    <link rel="stylesheet" href="style.css?v=5" />
    <script src="script.js?v=5" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-heading">
        <div class="heading-copy">
          <p class="eyebrow">和風横スクロール冒険譚 · 第一章</p>
          <h1>桃花の旅路</h1>
          <p class="instructions">小判を集め、鬼の待つ山の向こうを目指そう。</p>
        </div>
        <div class="heading-actions">
          <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false">♫ 音 OFF</button>
          <span class="heading-stamp">旅の巻物</span>
        </div>
      </header>

      <div class="arcade-layout">
        <section class="game-frame" aria-label="横スクロールアクションゲーム">
          <div class="cabinet-bar" aria-hidden="true">
            <span>桃花の旅路　／　鬼ヶ島への道</span>
            <span class="cabinet-lights"><i></i><i></i><i></i></span>
          </div>
          <div class="screen">
            <canvas id="game" width="960" height="540" aria-label="ゲーム画面">
              このゲームを遊ぶには、Canvasに対応したブラウザが必要です。
            </canvas>
          </div>
          <div class="touch-controls" aria-label="タッチ操作">
            <div class="move-controls">
              <button class="control-button" data-control="left" aria-label="左へ移動">◀</button>
              <button class="control-button" data-control="right" aria-label="右へ移動">▶</button>
            </div>
            <button class="control-button attack-button" data-control="attack" aria-label="攻撃">斬</button>
            <button class="control-button jump-button" data-control="jump" aria-label="ジャンプ">JUMP</button>
          </div>
        </section>

        <aside class="side-panel" aria-label="ゲーム情報">
          <section class="panel-card">
            <h2 class="panel-label">旅の手引き</h2>
            <div class="control-row">
              <span>移動</span>
              <span class="control-keys"><kbd>←</kbd><kbd>→</kbd></span>
            </div>
            <div class="control-row">
              <span>ジャンプ</span>
              <span class="control-keys"><kbd>SPACE</kbd></span>
            </div>
            <div class="control-row">
              <span>刀で斬る</span>
              <span class="control-keys"><kbd>J</kbd></span>
            </div>
            <div class="control-row">
              <span>旅をやり直す</span>
              <span class="control-keys"><kbd>R</kbd></span>
            </div>
          </section>
          <section class="panel-card mission-card">
            <div class="mission-icon" aria-hidden="true">★</div>
            <h2 class="panel-label">旅の目的</h2>
            <p>道中の小鬼を払い、小判を集めよう。山の大鬼を倒せば、その先に道が開ける。</p>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
